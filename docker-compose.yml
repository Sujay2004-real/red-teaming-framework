
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    networks:
      - labnet
    environment:
      # Defaults to the local dev origins. To allow another origin (e.g. a LAN
      # IP so the UI can be opened from another device), set CORS_ALLOW_ORIGINS
      # in your shell or a root .env file - no need to edit this file.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    env_file:
      # Every setting in .env has a default, and .env is gitignored, so a fresh
      # clone has no such file. Without required:false Compose refuses to start
      # the stack at all instead of running with those defaults.
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - data_volume:/app/data
    # Lets the scanners reach services on the Docker host itself (Docker
    # Desktop provides host.docker.internal natively; host-gateway maps it
    # on Linux). A service running on the host machine is reachable as
    # host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - labnet
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Where the browser reaches the backend. Defaults to localhost; override
      # VITE_API_URL (shell or root .env) with your machine's LAN IP to reach
      # the UI from another device on the network.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

  # The toolkit runs alone: the assessment targets (a self-hosted application
  # on the host, a Kali attacker VM, or any real authorized client system)
  # live outside this Compose stack. On Linux, uncomment network_mode: host
  # on the backend to put the scanners directly on the host network for
  # accurate LAN subnet scans.

volumes:
  data_volume:
  frontend_node_modules:

networks:
  labnet:
    driver: bridge
