
services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      # Every setting in .env has a default, and .env is gitignored, so a fresh
      # clone has no such file. Without required:false Compose refuses to start
      # the stack at all instead of running with those defaults.
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - data_volume:/app/data
    depends_on:
      - juice-shop
      - dvwa

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  juice-shop:
    image: docker.io/bkimminich/juice-shop:latest
    ports:
      - "3000:3000"

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    ports:
      - "8080:80"

volumes:
  data_volume:
  frontend_node_modules:
