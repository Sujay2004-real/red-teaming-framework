
services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Defaults to the local dev origins. To allow another origin (e.g. a LAN
      # IP so the UI can be opened from another device), set CORS_ALLOW_ORIGINS
      # in your shell or a root .env file - no need to edit this file.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    env_file:
      # Every setting in .env has a default, and .env is gitignored, so a fresh
      # clone has no such file. Without required:false Compose refuses to start
      # the stack at all instead of running with those defaults.
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - data_volume:/app/data
    depends_on:
      - juice-shop
      - dvwa

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Where the browser reaches the backend. Defaults to localhost; override
      # VITE_API_URL (shell or root .env) with your machine's LAN IP to reach
      # the UI from another device on the network.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

  juice-shop:
    image: docker.io/bkimminich/juice-shop:latest
    ports:
      - "3000:3000"

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    ports:
      - "8080:80"

volumes:
  data_volume:
  frontend_node_modules:
