
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    networks:
      - labnet
    environment:
      # Defaults to the local dev origins. To allow another origin (e.g. a LAN
      # IP so the UI can be opened from another device), set CORS_ALLOW_ORIGINS
      # in your shell or a root .env file - no need to edit this file.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    env_file:
      # Every setting in .env has a default, and .env is gitignored, so a fresh
      # clone has no such file. Without required:false Compose refuses to start
      # the stack at all instead of running with those defaults.
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - data_volume:/app/data
    # No depends_on the lab targets: they live behind the "lab" profile and
    # the backend starts fine without them (a real engagement has its own
    # authorized targets on the client network).

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - labnet
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Where the browser reaches the backend. Defaults to localhost; override
      # VITE_API_URL (shell or root .env) with your machine's LAN IP to reach
      # the UI from another device on the network.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

  # The deliberately vulnerable lab targets are behind the "lab" profile so a
  # real engagement can run the assessment toolkit alone:
  #   docker compose up                    -> backend + frontend only (toolkit)
  #   docker compose --profile lab up      -> toolkit + Juice Shop + DVWA (demo)
  # On Linux, uncomment network_mode on the backend to put the scanners
  # directly on the host network for accurate LAN subnet scans.
  juice-shop:
    image: docker.io/bkimminich/juice-shop:latest
    profiles: ["lab"]
    networks:
      - labnet
    ports:
      - "3000:3000"

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    profiles: ["lab"]
    networks:
      - labnet
    ports:
      - "8080:80"

volumes:
  data_volume:
  frontend_node_modules:

networks:
  labnet:
    # Fixed subnet so the Docker lab machines sit at stable, reproducible
    # addresses for the container-based demo. No sample-letter target lives
    # here any more: letter v4 (JB/SEC/2026/023) authorizes only the
    # virtualization lab's host-only network (storefront 192.168.56.10:3000,
    # legacy server 192.168.56.20:80, segment 192.168.56.0/24 — see
    # .clinerules "Deployment modes"), so the lab profile is purely a
    # fallback demo without the VMs. If this range collides with another
    # network on the host, compose refuses to start; change it here.
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
