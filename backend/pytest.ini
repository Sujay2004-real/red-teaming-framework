[pytest]
# testpaths are resolved relative to this file, so pytest never has to parse the
# absolute project path. That matters here: the repo lives under a directory
# named "Project Phase - II [IMPLEMENTATION]", and pytest reads the "[...]" in a
# path argument as parametrisation syntax and aborts with
# "ERROR: path cannot contain [] parametrization" before collecting anything.
testpaths = test_*.py

# Keep the temp base inside the project instead of the per-user system temp.
# pytest's default base is %LOCALAPPDATA%\Temp\pytest-of-<user>, which it must
# enumerate on every run to number the next dir; if an earlier run (interrupted,
# or launched at a different integrity level) leaves that folder with an ACL that
# denies listing, pytest aborts with "PermissionError: [WinError 5] Access is
# denied" before any tmp_path test can run. A project-local basetemp sidesteps
# that and keeps test artifacts in the repo (.pytest_tmp is gitignored). Note
# pytest wipes this directory at the start of each run, so keep it dedicated.
addopts = --basetemp=.pytest_tmp
