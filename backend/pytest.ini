[pytest]
# testpaths are resolved relative to this file, so pytest never has to parse the
# absolute project path. That matters here: the repo lives under a directory
# named "Project Phase - II [IMPLEMENTATION]", and pytest reads the "[...]" in a
# path argument as parametrisation syntax and aborts with
# "ERROR: path cannot contain [] parametrization" before collecting anything.
testpaths = test_*.py
